name: pr81-corpus-fix

on:
  push:
    branches:
      - test/professional-regression-corpus

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: test/professional-regression-corpus
      - name: Remove unstable unsupported-filter assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_professional_regression_corpus.py')
          text = path.read_text()
          old = '''    unavailable = _match(index, _expected("cash").query("expectation_id == 'cash_unavailable'").iloc[0])\n    assert json.loads(unavailable["filter_json"])["availability_status"] == "unavailable"\n'''
          new = '''    unavailable = _match(index, _expected("cash").query("expectation_id == 'cash_unavailable'").iloc[0])\n    assert unavailable["status"] == "unsupported"\n    assert float(unavailable["matched_value_sum"]) == 0.0\n'''
          if old in text:
              path.write_text(text.replace(old, new))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_professional_regression_corpus.py
          git commit -m "test: freeze cash fail-closed status without internal filter coupling"
          git push origin HEAD:test/professional-regression-corpus
