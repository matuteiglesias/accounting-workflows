name: phase1-apply

on:
  push:
    branches:
      - cleanup/phase1-prune-empty-architecture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cleanup/phase1-prune-empty-architecture
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded validation dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Apply Phase 1 reachability cleanup
        run: python scripts/_phase1_apply.py
      - name: Validate contracts and regressions
        run: make validate
      - name: Run fixture-safe pipeline
        run: make smoke-full
      - name: Reconcile Phase 0 fixture anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          from accounting.metrics.annual import build_annual_balance_dashboard

          root = Path('out/smoke/accounting')
          cls = pd.read_csv(root / 'classification_audit.csv')
          cls['amount'] = pd.to_numeric(cls['amount'], errors='coerce').fillna(0.0)
          got = cls.groupby(['Currency','semantic_bucket','semantic_subbucket'], dropna=False)['amount'].sum().to_dict()
          expected = {
              ('ARS','debt_movement','principal'): 1576761.0,
              ('ARS','family_withdrawal_candidate','personal_expense'): 29412662.0,
              ('ARS','funding_contribution','family_or_tenant_contribution'): 1427956.0,
              ('ARS','operating_revenue','rent'): 33075422.0,
              ('ARS','property_opex','legal'): 147000.0,
              ('ARS','property_opex','maintenance'): 240000.0,
              ('ARS','property_opex','services'): 5801045.41,
              ('ARS','property_opex','taxes'): 7427893.53,
              ('USD','debt_movement','principal'): 2240.0,
              ('USD','operating_revenue','rent'): 4180.0,
          }
          assert set(got) == set(expected), (got, expected)
          for key, value in expected.items():
              assert math.isclose(float(got[key]), value, rel_tol=0, abs_tol=1e-6), (key, got[key], value)

          assert len(pd.read_csv(root / 'semantic_leakage_qa.csv')) == 0

          ledger = pd.read_csv(root / 'ledger_canonical.csv')
          as_of = str(pd.to_datetime(ledger['Date'], errors='coerce').max().date())
          paths = build_annual_balance_dashboard(root, Path('out/smoke/phase1_metrics'), 'phase1', as_of)
          annual = pd.read_csv(paths['annual_balance_dashboard_metrics'])
          annual['value'] = pd.to_numeric(annual['value'], errors='coerce')

          checks = {
              ('ARS','IS.REVENUE.OPERATING'): 33075422.0,
              ('ARS','IS.RENT.TOTAL'): 33075422.0,
              ('ARS','IS.OPEX.PROPERTY'): 13615938.94,
              ('ARS','IS.NET.OPERATING'): 19459483.06,
              ('ARS','FUND.CONTRIB.TOTAL'): 1427956.0,
              ('ARS','DIST.DRAWS.PERSONAL'): 29412662.0,
              ('ARS','COV.NET.AFTER_DRAWS'): -8525222.94,
              ('ARS','COV.SAVINGS_RATE'): -0.4381012030850936,
              ('ARS','TR.FX.NET'): 0.0,
              ('USD','IS.REVENUE.OPERATING'): 4180.0,
              ('USD','IS.RENT.TOTAL'): 4180.0,
              ('USD','IS.OPEX.PROPERTY'): 0.0,
              ('USD','IS.NET.OPERATING'): 4180.0,
              ('USD','FUND.CONTRIB.TOTAL'): 0.0,
              ('USD','DIST.DRAWS.PERSONAL'): 0.0,
              ('USD','COV.NET.AFTER_DRAWS'): 4180.0,
              ('USD','COV.SAVINGS_RATE'): 1.0,
              ('USD','TR.FX.NET'): 0.0,
          }
          for (currency, metric_id), expected_value in checks.items():
              rows = annual[(annual['Currency'] == currency) & (annual['metric_id'] == metric_id)]
              rows = rows[rows['dimension_name'].isna()]
              assert len(rows) == 1, (currency, metric_id, rows)
              row = rows.iloc[0]
              assert row['value_status'] == 'available', (currency, metric_id, row['value_status'])
              assert math.isclose(float(row['value']), expected_value, rel_tol=0, abs_tol=1e-6), (currency, metric_id, row['value'], expected_value)

          for currency in ['ARS', 'USD']:
              cash = annual[(annual['Currency'] == currency) & (annual['metric_id'] == 'BS.CASH.TOTAL')]
              assert len(cash) == 1
              assert cash.iloc[0]['value_status'] == 'unavailable'

          print('Phase 0 semantic, currency, annual and governed-cash fixture anchors reconciled.')
          PY
      - name: Commit validated Phase 1 result
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: decommission alternate human and frontend architecture"
          git push origin HEAD:cleanup/phase1-prune-empty-architecture
