name: phase0-baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run repository validation and fixture smoke
        run: make smoke-full
      - name: Probe extended fixture view stage without changing baseline
        run: |
          set +e
          make smoke-views
          status=$?
          set -e
          mkdir -p out/smoke
          printf '%s\n' "$status" > out/smoke/smoke_views_exit_code.txt
          echo "smoke_views_exit_code=$status"
      - name: Build deterministic baseline summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import pandas as pd
          from accounting.metrics.annual import build_annual_balance_dashboard

          run_root = Path('out/smoke/accounting')
          metrics_dir = Path('out/smoke/baseline_metrics')
          ledger = pd.read_csv(run_root / 'ledger_canonical.csv')
          as_of = str(pd.to_datetime(ledger['Date'], errors='coerce').max().date())
          annual_paths = build_annual_balance_dashboard(run_root, metrics_dir, 'smoke', as_of)

          inventory = []
          for p in sorted(run_root.rglob('*')):
              if not p.is_file():
                  continue
              row = {'path': str(p.relative_to(run_root)), 'bytes': p.stat().st_size}
              if p.suffix.lower() == '.csv':
                  try:
                      row['rows'] = int(len(pd.read_csv(p)))
                  except Exception:
                      row['rows'] = None
              row['sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
              inventory.append(row)

          stmt = pd.read_csv(run_root / 'monthly_operating_statement.csv')
          stmt['amount'] = pd.to_numeric(stmt['amount'], errors='coerce').fillna(0.0)
          monthly = (
              stmt.groupby(['period','Currency','statement_line'], dropna=False)['amount']
              .sum().reset_index().sort_values(['period','Currency','statement_line'])
          )
          monthly_key = monthly.loc[monthly['statement_line'].isin([
              'operating_revenue','rent_revenue','property_opex_true','net_operating',
              'funding_contributions','family_draws_or_distributions','coverage_after_draws',
              'treasury_fx_conversion_in','treasury_fx_conversion_out','treasury_fx_cost','treasury_fx_net'
          ])]

          annual = pd.read_csv(annual_paths['annual_balance_dashboard_metrics'])
          annual['value'] = pd.to_numeric(annual['value'], errors='coerce')
          annual_key = annual.loc[annual['metric_id'].isin([
              'IS.REVENUE.OPERATING','IS.RENT.TOTAL','IS.OPEX.PROPERTY','IS.NET.OPERATING',
              'FUND.CONTRIB.TOTAL','DIST.DRAWS.PERSONAL','COV.NET.AFTER_DRAWS','COV.SAVINGS_RATE',
              'BS.CASH.TOTAL','BS.CASH.CLOSE.BOX','ID.DEBT.TOTAL.OPEN','ID.DEBT.PRINCIPAL.OPEN',
              'ID.DEBT.INTEREST.OPEN','TR.FX.NET'
          ])].sort_values(['period','Currency','metric_id','dimension_name','dimension_value'])

          cash = pd.read_csv(run_root / 'monthly_cash_close.csv')
          cash['close_amount'] = pd.to_numeric(cash['close_amount'], errors='coerce')
          cash_summary = (
              cash.groupby(['period','Currency','Box','position_type','validation_status','cash_suitability'], dropna=False)
              .agg(rows=('close_amount','size'), close_amount=('close_amount','sum'))
              .reset_index().sort_values(['period','Currency','Box','position_type'])
          )

          classification = pd.read_csv(run_root / 'classification_audit.csv')
          classification['amount'] = pd.to_numeric(classification['amount'], errors='coerce').fillna(0.0)
          class_summary = (
              classification.groupby(['Currency','semantic_bucket','semantic_subbucket'], dropna=False)
              .agg(amount=('amount','sum'), rows=('tx_id','size'))
              .reset_index().sort_values(['Currency','semantic_bucket','semantic_subbucket'])
          )

          payload = {
              'as_of_date': as_of,
              'smoke_views_exit_code': int(Path('out/smoke/smoke_views_exit_code.txt').read_text().strip()),
              'artifact_inventory': inventory,
              'classification_totals': class_summary.to_dict('records'),
              'monthly_key_totals': monthly_key.to_dict('records'),
              'annual_key_totals': annual_key.where(pd.notna(annual_key), None).to_dict('records'),
              'cash_position_summary': cash_summary.where(pd.notna(cash_summary), None).to_dict('records'),
              'annual_qa': pd.read_csv(annual_paths['annual_balance_dashboard_qa']).to_dict('records'),
          }
          print('PHASE0_BASELINE_JSON_BEGIN')
          print(json.dumps(payload, indent=2, ensure_ascii=False, default=str))
          print('PHASE0_BASELINE_JSON_END')
          PY
