name: d-annual-flow-run
on:
  push:
    branches: [feat/annual-flow-membership]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/annual-flow-membership
      - run: python scripts/_d_annual_flow_patch.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounting/metrics/annual.py accounting/professional/drilldown.py
          git commit -m "feat: materialize and consume governed annual flow lineage"
          git push origin HEAD:feat/annual-flow-membership
