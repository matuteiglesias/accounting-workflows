name: b-test-run
on:
  push:
    branches: [fix/debt-position-asof-authority]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/debt-position-asof-authority
      - run: python scripts/_b_test_patch.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_position_activity_marts.py
          git commit -m "test: invert invalid debt as-of defect into fail-closed invariant"
          git push origin HEAD:fix/debt-position-asof-authority
