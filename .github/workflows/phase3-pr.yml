name: phase3-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'cleanup/phase3-stage-d-infrastructure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 3 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cleanup/phase3-stage-d-infrastructure
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded validation dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Capture Stage D source size before
        run: |
          echo "before_lines=$(git show origin/main:accounting/stage_d/materialize.py | wc -l)"
          echo "before_bytes=$(git show origin/main:accounting/stage_d/materialize.py | wc -c)"
      - name: Apply Stage D infrastructure deduplication
        run: python scripts/_phase3_apply.py
      - name: Capture Stage D source size after
        run: |
          echo "after_lines=$(wc -l < accounting/stage_d/materialize.py)"
          echo "after_bytes=$(wc -c < accounting/stage_d/materialize.py)"
      - name: Validate contracts and regressions
        run: make validate
      - name: Run fixture-safe pipeline
        run: make smoke-full
      - name: Reconcile Phase 0 accounting anchors and Stage D artifact inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import pandas as pd
          from accounting.metrics.annual import build_annual_balance_dashboard

          root = Path('out/smoke/accounting')
          expected_files = {
              'ledger_canonical.csv',
              'per_flow_time_long.freq=M.csv',
              'per_party_time_long.freq=M.csv',
              'box_balance_time_long.freq=M.csv',
              'box_flow_balance_time_long.freq=M.csv',
              'loans_time.freq=M.csv',
              'daily_cash_position.csv',
              'partitions.json',
              'monthly_cash_close.csv',
              'monthly_cash_close_qa.csv',
              'semantic_rule_registry.csv',
              'classification_audit.csv',
              'classification_audit_summary.csv',
              'monthly_flow_semantic_split.csv',
              'classification_validation.csv',
              'semantic_leakage_qa.csv',
              'semantic_dashboard_coverage.csv',
              'monthly_box_treasury_flow.csv',
              'monthly_box_treasury_flow_qa.csv',
              'monthly_operating_statement.csv',
              'monthly_operating_statement_qa.csv',
              'artifact_contracts.csv',
              'artifact_contract_qa.csv',
              'meta/stage_D_materialize.json',
          }
          missing = sorted(name for name in expected_files if not (root / name).exists())
          assert not missing, missing

          stage_manifest = json.loads((root / 'meta/stage_D_materialize.json').read_text(encoding='utf-8'))
          assert stage_manifest['stage'] == 'D.materialize'
          relpaths = {item['relpath'] for item in stage_manifest['outputs']}
          for required in [
              'per_flow_time_long.freq=M.csv', 'per_party_time_long.freq=M.csv',
              'box_balance_time_long.freq=M.csv', 'box_flow_balance_time_long.freq=M.csv',
              'loans_time.freq=M.csv', 'daily_cash_position.csv', 'partitions.json',
          ]:
              assert required in relpaths, required

          cls = pd.read_csv(root / 'classification_audit.csv')
          cls['amount'] = pd.to_numeric(cls['amount'], errors='coerce').fillna(0.0)
          got = cls.groupby(['Currency','semantic_bucket','semantic_subbucket'], dropna=False)['amount'].sum().to_dict()
          expected = {
              ('ARS','debt_movement','principal'): 1576761.0,
              ('ARS','family_withdrawal_candidate','personal_expense'): 29412662.0,
              ('ARS','funding_contribution','family_or_tenant_contribution'): 1427956.0,
              ('ARS','operating_revenue','rent'): 33075422.0,
              ('ARS','property_opex','legal'): 147000.0,
              ('ARS','property_opex','maintenance'): 240000.0,
              ('ARS','property_opex','services'): 5801045.41,
              ('ARS','property_opex','taxes'): 7427893.53,
              ('USD','debt_movement','principal'): 2240.0,
              ('USD','operating_revenue','rent'): 4180.0,
          }
          assert set(got) == set(expected)
          for key, value in expected.items():
              assert math.isclose(float(got[key]), value, rel_tol=0, abs_tol=1e-6), (key, got[key], value)
          assert len(pd.read_csv(root / 'semantic_leakage_qa.csv')) == 0

          ledger = pd.read_csv(root / 'ledger_canonical.csv')
          as_of = str(pd.to_datetime(ledger['Date'], errors='coerce').max().date())
          paths = build_annual_balance_dashboard(root, Path('out/smoke/phase3_metrics'), 'phase3', as_of)
          annual = pd.read_csv(paths['annual_balance_dashboard_metrics'])
          annual['value'] = pd.to_numeric(annual['value'], errors='coerce')
          checks = {
              ('ARS','IS.REVENUE.OPERATING'): 33075422.0,
              ('ARS','IS.OPEX.PROPERTY'): 13615938.94,
              ('ARS','IS.NET.OPERATING'): 19459483.06,
              ('ARS','FUND.CONTRIB.TOTAL'): 1427956.0,
              ('ARS','DIST.DRAWS.PERSONAL'): 29412662.0,
              ('ARS','COV.NET.AFTER_DRAWS'): -8525222.94,
              ('ARS','COV.SAVINGS_RATE'): -0.4381012030850936,
              ('USD','IS.REVENUE.OPERATING'): 4180.0,
              ('USD','IS.OPEX.PROPERTY'): 0.0,
              ('USD','IS.NET.OPERATING'): 4180.0,
              ('USD','COV.SAVINGS_RATE'): 1.0,
          }
          for (currency, metric_id), expected_value in checks.items():
              rows = annual[(annual['Currency'] == currency) & (annual['metric_id'] == metric_id) & annual['dimension_name'].isna()]
              assert len(rows) == 1, (currency, metric_id)
              row = rows.iloc[0]
              assert row['value_status'] == 'available'
              assert math.isclose(float(row['value']), expected_value, rel_tol=0, abs_tol=1e-6)
          for currency in ['ARS', 'USD']:
              cash = annual[(annual['Currency'] == currency) & (annual['metric_id'] == 'BS.CASH.TOTAL')]
              assert len(cash) == 1 and cash.iloc[0]['value_status'] == 'unavailable'

          print('Phase 3 Stage D inventory and Phase 0 accounting anchors reconciled.')
          PY
      - name: Commit validated Phase 3 result
        run: |
          rm -f scripts/_phase3_apply.py .github/workflows/phase3-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: deduplicate Stage D infrastructure"
          git pull --rebase origin cleanup/phase3-stage-d-infrastructure
          git push origin HEAD:cleanup/phase3-stage-d-infrastructure
