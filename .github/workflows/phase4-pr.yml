name: phase4-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'cleanup/phase4-narrow-legacy-facades'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 4 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cleanup/phase4-narrow-legacy-facades
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded validation dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Harden caller census for relative imports and jointly transformed facades
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_phase4_apply.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "class CallerVisitor(ast.NodeVisitor):\n    def __init__(self, module: str):\n        self.module = module\n        self.parent, self.child = module.rsplit('.', 1)\n",
                  "class CallerVisitor(ast.NodeVisitor):\n    def __init__(self, module: str, caller_package: str):\n        self.module = module\n        self.caller_package = caller_package\n        self.parent, self.child = module.rsplit('.', 1)\n",
              ),
              (
                  "    def visit_ImportFrom(self, node: ast.ImportFrom) -> None:\n        if node.module == self.module:\n            for alias in node.names:\n                if alias.name == '*':\n                    self.dynamic_errors.append('star import')\n                else:\n                    self.symbols.add(alias.name)\n        elif node.module == self.parent:\n            for alias in node.names:\n                if alias.name == self.child:\n                    self.module_aliases.add(alias.asname or alias.name)\n        self.generic_visit(node)\n",
                  "    def visit_ImportFrom(self, node: ast.ImportFrom) -> None:\n        source_module = node.module or ''\n        if node.level:\n            parts = self.caller_package.split('.') if self.caller_package else []\n            keep = max(0, len(parts) - (node.level - 1))\n            base = parts[:keep]\n            if source_module:\n                base.append(source_module)\n            source_module = '.'.join(base)\n        if source_module == self.module:\n            for alias in node.names:\n                if alias.name == '*':\n                    self.dynamic_errors.append('star import')\n                else:\n                    self.symbols.add(alias.name)\n        elif source_module == self.parent:\n            for alias in node.names:\n                if alias.name == self.child:\n                    self.module_aliases.add(alias.asname or alias.name)\n        self.generic_visit(node)\n",
              ),
              (
                  "        visitor = CallerVisitor(module)\n",
                  "        module_parts = rel[:-3].split('/')\n        caller_package = '.'.join(module_parts[:-1])\n        visitor = CallerVisitor(module, caller_package)\n",
              ),
              (
                  "        for err in visitor.dynamic_errors:\n            errors.append(f'{rel}: {err} of {module}')\n",
                  "        if rel not in TARGETS:\n            for err in visitor.dynamic_errors:\n                errors.append(f'{rel}: {err} of {module}')\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected Phase 4 scanner block not found: ' + old.splitlines()[0])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Seed transitive public drilldown compatibility into Wave 4 census
        run: |
          cat >> accounting/professional/drilldown.py <<'PY'

          # PHASE4_TRANSITIVE_COMPAT_START
          # Temporary census-only references. Removed before validation/commit.
          _PHASE4_TRANSITIVE_COMPAT = (
              _base.STATUS_OK,
              _base.STATUS_UNSUPPORTED,
              _base.DEFAULT_TOLERANCE,
              _base.INDEX_FILENAME,
              _base.row_context_id,
              _base._annual_formula_spec,
              _base._build_annual_formula_cell,
              _base._cash_bridge_line_spec,
              _base._safe_div,
              _base._semantic_filter_for_statement_line,
          )
          # PHASE4_TRANSITIVE_COMPAT_END
          PY
      - name: Apply caller-derived explicit facade surfaces
        run: |
          python scripts/_phase4_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('accounting/professional/drilldown.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('\n# PHASE4_TRANSITIVE_COMPAT_START')
          end_marker = '# PHASE4_TRANSITIVE_COMPAT_END\n'
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          python scripts/_phase4_post.py
          echo '--- facade summary ---'
          cat notes/accounting_simplification_phase4_facade_summary_20260824.csv
      - name: Validate contracts and regressions
        run: make validate
      - name: Run fixture-safe pipeline
        run: make smoke-full
      - name: Reconcile Phase 0 accounting anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import pandas as pd
          from accounting.metrics.annual import build_annual_balance_dashboard

          root = Path('out/smoke/accounting')
          cls = pd.read_csv(root / 'classification_audit.csv')
          cls['amount'] = pd.to_numeric(cls['amount'], errors='coerce').fillna(0.0)
          got = cls.groupby(['Currency','semantic_bucket','semantic_subbucket'], dropna=False)['amount'].sum().to_dict()
          expected = {
              ('ARS','debt_movement','principal'): 1576761.0,
              ('ARS','family_withdrawal_candidate','personal_expense'): 29412662.0,
              ('ARS','funding_contribution','family_or_tenant_contribution'): 1427956.0,
              ('ARS','operating_revenue','rent'): 33075422.0,
              ('ARS','property_opex','legal'): 147000.0,
              ('ARS','property_opex','maintenance'): 240000.0,
              ('ARS','property_opex','services'): 5801045.41,
              ('ARS','property_opex','taxes'): 7427893.53,
              ('USD','debt_movement','principal'): 2240.0,
              ('USD','operating_revenue','rent'): 4180.0,
          }
          assert set(got) == set(expected)
          for key, value in expected.items():
              assert math.isclose(float(got[key]), value, rel_tol=0, abs_tol=1e-6), (key, got[key], value)
          assert len(pd.read_csv(root / 'semantic_leakage_qa.csv')) == 0

          ledger = pd.read_csv(root / 'ledger_canonical.csv')
          as_of = str(pd.to_datetime(ledger['Date'], errors='coerce').max().date())
          paths = build_annual_balance_dashboard(root, Path('out/smoke/phase4_metrics'), 'phase4', as_of)
          annual = pd.read_csv(paths['annual_balance_dashboard_metrics'])
          annual['value'] = pd.to_numeric(annual['value'], errors='coerce')
          checks = {
              ('ARS','IS.REVENUE.OPERATING'): 33075422.0,
              ('ARS','IS.OPEX.PROPERTY'): 13615938.94,
              ('ARS','IS.NET.OPERATING'): 19459483.06,
              ('ARS','FUND.CONTRIB.TOTAL'): 1427956.0,
              ('ARS','DIST.DRAWS.PERSONAL'): 29412662.0,
              ('ARS','COV.NET.AFTER_DRAWS'): -8525222.94,
              ('ARS','COV.SAVINGS_RATE'): -0.4381012030850936,
              ('USD','IS.REVENUE.OPERATING'): 4180.0,
              ('USD','IS.OPEX.PROPERTY'): 0.0,
              ('USD','IS.NET.OPERATING'): 4180.0,
              ('USD','COV.SAVINGS_RATE'): 1.0,
          }
          for (currency, metric_id), expected_value in checks.items():
              rows = annual[(annual['Currency'] == currency) & (annual['metric_id'] == metric_id) & annual['dimension_name'].isna()]
              assert len(rows) == 1, (currency, metric_id)
              row = rows.iloc[0]
              assert row['value_status'] == 'available'
              assert math.isclose(float(row['value']), expected_value, rel_tol=0, abs_tol=1e-6)
          for currency in ['ARS', 'USD']:
              cash = annual[(annual['Currency'] == currency) & (annual['metric_id'] == 'BS.CASH.TOTAL')]
              assert len(cash) == 1 and cash.iloc[0]['value_status'] == 'unavailable'
          print('Phase 4 facade narrowing preserves Phase 0 accounting anchors.')
          PY
      - name: Commit validated Phase 4 result
        run: |
          rm -f scripts/_phase4_apply.py scripts/_phase4_post.py .github/workflows/phase4-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: narrow legacy facade compatibility surfaces"
          git pull --rebase origin cleanup/phase4-narrow-legacy-facades
          git push origin HEAD:cleanup/phase4-narrow-legacy-facades
