schema: report_director.task_queue.v1
status: FIRST_ITERATION_VERIFIED_LOCAL
autonomous_scheduler_enabled: false
codex_dispatch_enabled: false
source_of_truth: MISSION.md
scope:
  primary_repo: accounting-workflows
  secondary_repo: accounting-viewer
  input_policy: exact_run_or_approved_fixture
  privacy: repo_public_private_context_ignored
limits:
  current_artifact_reviews: 1
  codex_implementation_tasks: 1
  open_prs_awaiting_decision: 1
  iterations_without_material_gain_before_idle: 3
priority_rule: "Highest consequence to stakeholder understanding per smallest verifiable intervention; revisit after each result."
tasks:
  - id: RD-001
    status: DONE
    title: "Inspeccionar un informe real y emitir una crítica verificable"
    mode: DIRECT_ANALYSIS_FIRST
    trigger: "Arranque de la misión y un HTML/PDF existente con fuente y corte identificables."
    target: "Elegir un informe de alta relevancia, preferentemente Treasury Accountability o TS09, sin duplicar producción."
    decision_question: "¿Qué conclusión razonable podría extraer un stakeholder, y qué inferencia incorrecta sugiere?"
    input_requirements:
      - "Reporte HTML/PDF de una corrida exacta o preview identificado."
      - "Fuente/trace y manifest cuando existan."
      - "Audience definida y límites de confidencialidad."
    deliverable: "Tarjeta de crítica: intended_claim, observed_chart, source_check, audience_misread, impact, smallest_fix, test_plan, recommendation."
    acceptance:
      - "La interpretación se comprueba contra al menos una tabla/trace/source."
      - "Se examina la representación realmente renderizada, no sólo el código."
      - "Hay una recomendación acotada, o NO_OP si no se encuentra una falla relevante."
    blocked_by: []
  - id: RD-002
    status: DONE
    title: "Corregir la primera falla de comunicación confirmada"
    mode: CHANGE_ONLY_IF_JUSTIFIED
    trigger: "RD-001 descubre una lectura errónea, contradicción u obstáculo material."
    target: "Título/leyenda/copy/orden/tablas existentes o, sólo si hace falta, código del renderer."
    deliverable: "Antes/después y un diff mínimo; test de regresión; preview privado; lista de impactos."
    acceptance:
      - "Los inputs y la semántica contable permanecen idénticos o se escala la decisión."
      - "El PDF y HTML muestran el cambio correcto sin recortes."
      - "El lector puede responder la pregunta sin asumir banco, derecho o dato inexistente."
    blocked_by: []
  - id: RD-003
    status: HOLD
    title: "Auditar coherencia entre informes de una misma decisión"
    mode: DIRECT_ANALYSIS
    trigger: "Dos artefactos usados juntos presentan diferencias de corte, concepto o audiencia."
    target: "Por ejemplo, Treasury vs TS09 vs distribución; separando hechos observados de escenarios."
    deliverable: "Mapa de afirmaciones compatibles, incompatibilidades reales y cambio mínimo recomendado."
    acceptance:
      - "Comparabilidad por Box, currency, grain, run y as-of explicitada."
      - "Diferencias semánticas correctas permanecen, no se fuerza igualdad artificial."
    blocked_by: ["Caso y dos artefactos concretos"]
  - id: RD-004
    status: HOLD
    title: "Probar el recorrido del Accounting Viewer"
    mode: USER_JOURNEY_REVIEW
    trigger: "Un lector no encuentra el informe o interpreta el índice como evidencia que no contiene."
    target: "Revisar Panorama → Administración → Rendición → Decisiones usando el catálogo aceptado."
    deliverable: "Prueba del recorrido y, si hay fallo probado, ajuste editorial acotado sin cómputo nuevo."
    acceptance:
      - "Navegación depende del catálogo y no inventa reportes publicados."
      - "Distinción entre artefactos privados y públicos; navegación sin datos crudos."
      - "No pisa ediciones en curso del Viewer."
    blocked_by: ["Aprobación de intervenir sobre un worktree Viewer posiblemente modificado"]
  - id: RD-005
    status: HOLD
    title: "Mejorar controles reproducibles de reportes"
    mode: CODEX_BUILDER_ONLY_AFTER_BUG
    trigger: "Una falla recurrente de QA se reproduce con fixture."
    target: "Sólo el test o renderer que habilita la corrección necesaria."
    deliverable: "PR pequeño + fixture que falla antes y pasa después."
    acceptance:
      - "No crea un engine alternativo ni un pipeline de publicación."
      - "Conserva manifiestos, source hashes, missing-vs-zero y cifras."
      - "Tests y visual post-render aprobados."
    blocked_by: ["Falla observada y scope de modificación autorizado"]
  - id: RD-006
    status: HOLD
    title: "Mejorar la rendición visual de comprobantes"
    mode: DIRECT_REVIEW_FIRST
    trigger: "Nueva biblioteca de comprobantes aprobada o feedback documental del Evidence Leader."
    target: "Entendibilidad, navegación, estado documental y links de pm_payment_evidence."
    deliverable: "Crítica y ajuste de lectura sin aprobar o divulgar documentos."
    acceptance:
      - "Corte de evidencia separado de corte contable y visible."
      - "Ausencia de proof no se presenta como impago."
      - "No se publican adjuntos privados por inferencia."
    blocked_by: ["Snapshot de comprobantes seleccionado y política de acceso validada"]
  - id: RD-007
    status: EVENT_TRIGGERED
    title: "Mantenimiento y regresión"
    mode: REPAIR_OR_NO_OP
    trigger: "Nueva corrida, cambio en narrativa, report regression, o feedback real."
    target: "Detectar diferencia material respecto de un artefacto aprobado, no producir churn cosmético."
    deliverable: "Una reparación acotada o NO_OP con explicación."
    acceptance:
      - "Existe un fallo material reproducible, no sólo preferencia estética."
      - "Sin cambios a ledger/publicación, salvo autorización separada."
    blocked_by: []
  - id: RD-008
    status: DONE
    title: "A0-A17: auditar utilidad comunicacional y corregir la portada anual"
    mode: DIRECT_REVIEW_AND_BOUNDED_RENDER
    target: "Annual Management, A-series y catalogo/Viewer existente, sin duplicar artefactos."
    deliverable: "Auditoria privada y preview HTML/PDF de portada reorganizada con prueba de regresion."
    acceptance:
      - "Correccion de jerarquia visual sin cambio de metrica gobernada."
      - "Fixture tests, fuentes de tarjetas y PDF privado inspeccionados."
    blocked_by: []
  - id: RD-009
    status: READY
    title: "Hacer util la portada del informe de tesoreria"
    mode: DIRECT_REVIEW_THEN_BOUNDED_CHANGE
    target: "Treasury Accountability: portada con resumen de ultimo cierre completo en Box y moneda nativa."
    deliverable: "Antes/despues con HTML/PDF privado y validacion de trace/tabla/QA para run exacto."
    acceptance:
      - "No presentar control origen cero como liquidez bancaria."
      - "No mezclar scopes, periodos ni monedas, ni modificar fuentes o publicacion."
      - "La primera pagina responde una pregunta real sin ocupar una pagina vacia."
    blocked_by: []
  - id: RD-010
    status: READY_FOR_PRIVATE_CHART_QA
    title: "Costos 2022-26: quien puso los fondos cuando PM/FB fue intermediario"
    mode: PRIVATE_SOURCE_CROSSWALK
    target: "172 costos inicialmente sin actor en run 20261119T110543Z_FBPM."
    deliverable: "Cruce privado de 172 costos, proyeccion v7 de 288 gastos y fuente C. Long Ledger corregida: 5 filas agua Hector en FB (verificacion nativa 19-Nov-2026)."
    acceptance:
      - "Pares de fecha, importe y Box sin contar dos veces las entradas de financiacion."
      - "Propuestas separadas de atribuciones canonicas, reintegros y carga economica final."
      - "Reglas globales de fuente de PM/FB validadas por Matias antes de retocar las tortas."
    blocked_by: ["Nuevo run canonico para reflejar los 5 asientos de Hector corregidos en la Sheet fuente (no ejecutado)", "Confirmar eventual reintegro de Chino para AySA agosto pagada 8-Sep y espejos HH -> PM pendientes", "Atribuir beneficiarios finales de rentas PM antes de publicar comparacion costo vs beneficio"]
